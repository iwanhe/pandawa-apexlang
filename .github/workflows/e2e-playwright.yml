name: E2E Playwright (oracleapex.com)

# Dijalankan manual: aplikasi di oracleapex.com di-import manual (D-10),
# jadi test dijalankan setelah import versi baru.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project'
        required: false
        default: all
        type: choice
        options:
          - all
          - mobile-chrome
          - mobile-iphone-viewport
          - desktop-chrome

permissions:
  contents: read

concurrency:
  group: e2e-oracleapex
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e
    env:
      APEX_APP_URL: ${{ secrets.APEX_APP_URL }}
      APEX_USERNAME: ${{ secrets.APEX_USERNAME }}
      APEX_PASSWORD: ${{ secrets.APEX_PASSWORD }}
      # opsional: password bersama user demo (create_users.sql) untuk test akses per role
      APEX_ROLE_PASSWORD: ${{ secrets.APEX_ROLE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check secrets
        run: |
          missing=""
          for s in APEX_APP_URL APEX_USERNAME APEX_PASSWORD; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret belum di-set:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -z "$APEX_ROLE_PASSWORD" ]; then
            echo "::warning::Secret APEX_ROLE_PASSWORD belum di-set: test akses per role (roles.spec.ts) dilewati."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run tests
        env:
          PW_PROJECT: ${{ inputs.project }}
        run: |
          if [ -z "$PW_PROJECT" ] || [ "$PW_PROJECT" = "all" ]; then
            npx playwright test
          else
            npx playwright test --project="$PW_PROJECT"
          fi

      - name: Upload report (HTML, trace, video, screenshot, browser log)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14
